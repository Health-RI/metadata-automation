name: Action Test

on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run the action on the example input
        uses: ./
        with:
          excel-path: inputs/HealthRI_v2.0.2.xlsx
          output-path: ${{ runner.temp }}/generated
          namespace: hri

      - name: Check the output is flat and non-empty
        run: |
          ls "$RUNNER_TEMP"/generated
          test -n "$(ls "$RUNNER_TEMP"/generated/hri-*.ttl)"
