name: Action Test

on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run the action on the example input
        uses: ./
        with:
          excel-path: inputs/HealthRI_v2.0.2.xlsx
          output-path: ${{ runner.temp }}/generated/pieces
          validation-output-path: ${{ runner.temp }}/generated/validation
          validation-file-name: Validation.ttl
          namespace: hri

      - name: Check the per-class output is flat and holds no merged files
        run: |
          ls "$RUNNER_TEMP"/generated/pieces
          test -n "$(ls "$RUNNER_TEMP"/generated/pieces/hri-*.ttl)"
          test -z "$(ls "$RUNNER_TEMP"/generated/pieces | grep -- '-shapes.ttl')"

      - name: Check the validation SHACL is written under the requested name
        run: test -s "$RUNNER_TEMP"/generated/validation/Validation.ttl

      - name: The action fails when FDP SHACLs are requested but the Excel has no independent class
        id: fdp-without-schemas
        uses: ./
        continue-on-error: true
        with:
          excel-path: inputs/HealthRI_v2.0.2.xlsx
          output-path: ${{ runner.temp }}/generated-fdp/pieces
          fdp-output-path: ${{ runner.temp }}/generated-fdp/fdp
          namespace: hri

      - name: Check that failure was reported
        run: test "${{ steps.fdp-without-schemas.outcome }}" = "failure"

  excel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Copy the plain example Excel
        run: cp tests/test_input/plain_small.xlsx "$RUNNER_TEMP/model.xlsx"

      - name: The check fails on an Excel without technical columns
        id: check
        uses: ./excel-check
        continue-on-error: true
        with:
          excel-path: ${{ runner.temp }}/model.xlsx
          hint: Run the Plan columns workflow.

      - name: Check that failure was reported with the hint
        run: |
          test "${{ steps.check.outcome }}" = "failure"
          grep -q "Run the Plan columns workflow." "$GITHUB_STEP_SUMMARY"

      - name: Plan the Excel
        id: plan
        uses: ./excel-plan
        with:
          excel-path: ${{ runner.temp }}/model.xlsx

      - name: Check the plan was written next to the Excel and the Excel is untouched
        run: |
          test "${{ steps.plan.outputs.plan-written }}" = "true"
          test -s "$RUNNER_TEMP/model-plan.xlsx"
          cmp "$RUNNER_TEMP/model.xlsx" tests/test_input/plain_small.xlsx

      - name: Planning again does not replace the plan
        id: replan
        uses: ./excel-plan
        continue-on-error: true
        with:
          excel-path: ${{ runner.temp }}/model.xlsx

      - name: Check that the existing plan was protected
        run: test "${{ steps.replan.outcome }}" = "failure"

      - name: Apply the plan
        run: >-
          uv run --python 3.13 --frozen metadata-automation apply-plan -p "$RUNNER_TEMP/model-plan.xlsx"

      - name: Check the plan is gone and the edits are applied
        run: |
          test ! -e "$RUNNER_TEMP/model-plan.xlsx"
          # Required cells are still empty, so the check fails, but no edit is pending any more.
          result="$(uv run --python 3.13 --frozen metadata-automation check-excel -i "$RUNNER_TEMP/model.xlsx" || true)"
          echo "$result"
          echo "$result" | grep -q "0 edit(s) pending"

