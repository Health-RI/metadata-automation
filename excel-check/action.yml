name: Check the technical columns of the metadata Excel
description: >-
  Checks that the technical columns (SHACL_*, SeMPyRO_*, prefixes, classes) of the metadata Excel are correct and
  complete. Fails with a listing of what is pending or empty and a hint on what to do; the result is also written to
  the job summary. The Excel is never modified.

inputs:
  excel-path:
    description: Path to the metadata Excel file, relative to the workspace.
    required: true
  namespace:
    description: >-
      Namespace prefix used to derive empty class_URI values. If omitted, class_URI is not derived and an empty
      class_URI counts as a required cell to fill in.
    required: false
    default: ""
  ignore-gaps:
    description: >-
      Column patterns whose empty required cells are not counted, separated by commas or newlines, e.g.
      `SeMPyRO_*` while SeMPyRO classes are not generated yet. They are reported as not checked.
    required: false
    default: ""
  hint:
    description: What to do when the check fails, shown in the result, e.g. a link to the plan workflow.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Check the Excel
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXCEL_PATH: ${{ inputs.excel-path }}
        NAMESPACE: ${{ inputs.namespace }}
        IGNORE_GAPS: ${{ inputs.ignore-gaps }}
        HINT: ${{ inputs.hint }}
      run: |
        set -uo pipefail
        args=(-i "$EXCEL_PATH" --summary "$GITHUB_STEP_SUMMARY")
        if [ -n "$NAMESPACE" ]; then args+=(-n "$NAMESPACE"); fi
        while read -r pattern; do
          if [ -n "$pattern" ]; then args+=(--ignore-gaps "$pattern"); fi
        done < <(printf '%s\n' "$IGNORE_GAPS" | tr ',' '\n' | sed 's/^ *//; s/ *$//')
        if [ -n "$HINT" ]; then args+=(--hint "$HINT"); fi
        uv run --python 3.13 --frozen --project "$ACTION_PATH/.." metadata-automation check-excel "${args[@]}"
        status=$?
        if [ "$status" -eq 1 ]; then
          echo "::error title=Excel check failed::The technical columns of $EXCEL_PATH are not correct and complete. See the job summary."
        fi
        exit "$status"
